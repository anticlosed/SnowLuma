main:
  "crontab: 57 14 * * *":
    - name: sync-from-github
      runner:
        cpus: 1
      stages:
        - name: sync-from-github
          script: |
            git remote add upstream https://github.com/SnowLuma/SnowLuma.git || true
            git fetch upstream --tags
            git checkout main
            git merge upstream/main --allow-unrelated-histories -m "自动同步 GitHub 更新" || {
              echo "⚠️ 合并冲突，上游历史被重写"
              git merge --abort
              git branch -f main-backup main
              git push origin main-backup --force
              git reset --hard upstream/main
              git push origin main --force
              git push origin --tags --force
              echo "✅ 旧历史保存到 main-backup，main 已对齐上游新历史"
              exit 0
            }
            git push origin main
            git push origin --tags --force
            
